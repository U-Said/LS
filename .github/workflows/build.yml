# Builds FastRevers for Windows x64, Windows ARM64 and macOS (universal), runs the self-tests and makes the
# Microsoft Store package. A tag v* also publishes the archives to a GitHub release of this repository.
name: Build

on:
  push:
    branches: [main, native]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            zip: FastRevers-Windows.zip
            machine: '0x8664'
          - arch: ARM64
            runner: windows-11-arm
            zip: FastRevers-Windows-arm64.zip
            machine: '0xAA64'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -A ${{ matrix.arch }}
          cmake --build build --config Release

      - name: Self-test (native ${{ matrix.arch }})
        shell: pwsh
        run: |
          build\Release\coretest.exe > coretest.txt
          if ($LASTEXITCODE) { Get-Content coretest.txt -Encoding UTF8; throw "detector self-test failed" }
          $p = Start-Process build\Release\FastRevers.exe -ArgumentList '--selftest', 'selftest.txt' -Wait -PassThru
          Get-Content selftest.txt -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "FastRevers.exe self-test: $($p.ExitCode) failed" }

      - name: Check the binary
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes('build\Release\FastRevers.exe')
          $machine = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
          'FastRevers.exe: {0:N0} bytes, machine 0x{1:X4}' -f $b.Length, $machine
          if ($machine -ne ${{ matrix.machine }}) { throw 'wrong architecture' }

      # Code signing by SignPath Foundation (free for open source), only for releases. It stays off until the
      # repository has the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG and the
      # secret SIGNPATH_API_TOKEN. The SignPath artifact configuration: <zip-file> with <pe-file path="FastRevers.exe">.
      # Every signing request waits for a manual approval in SignPath.
      - name: Upload the unsigned exe for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.arch }}
          path: build/Release/FastRevers.exe
          retention-days: 1

      - name: Sign (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed exe
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed\FastRevers.exe
          "signature: $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw 'the signed exe has no valid signature' }
          Copy-Item signed\FastRevers.exe build\Release\FastRevers.exe -Force

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\Release\FastRevers.exe, LICENSE -DestinationPath ${{ matrix.zip }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          retention-days: 30

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash macos/build.sh

      - name: Self-test
        run: |
          build/macos/coretest > /dev/null
          build/macos/FastRevers.app/Contents/MacOS/FastRevers --selftest
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "== Intel slice (Rosetta) =="
            arch -x86_64 build/macos/FastRevers.app/Contents/MacOS/FastRevers --selftest | tail -n 1
          else
            echo "Rosetta is not available here: Intel slice not run"
          fi
          build/macos/FastRevers.app/Contents/MacOS/FastRevers --render-icon menubar-icon.png

      - name: Package
        run: |
          # LICENSE goes next to the app, not into it: the signed bundle must not change
          mkdir -p zip
          ditto build/macos/FastRevers.app zip/FastRevers.app
          cp LICENSE zip/
          ditto -c -k zip FastRevers-macOS.zip
          codesign --verify --deep --strict zip/FastRevers.app
          unzip -l FastRevers-macOS.zip | tail -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: FastRevers-macOS.zip
          path: FastRevers-macOS.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: menubar-icon
          path: menubar-icon.png
          retention-days: 7

  # Microsoft Store package (x64 + ARM64 bundle) made from the two exe above. It is not a release file: it goes to
  # Partner Center, which signs it. The identity comes from Partner Center > Product identity, kept in the
  # repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_NAME (without them: a test identity).
  msix:
    name: Microsoft Store package
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: FastRevers-Windows*.zip
          path: zips
          merge-multiple: true

      - name: Build the MSIX bundle
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: |
          Expand-Archive zips\FastRevers-Windows.zip x64
          Expand-Archive zips\FastRevers-Windows-arm64.zip arm64
          $id = @{}
          if ($env:MSIX_IDENTITY_NAME) { $id.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $id.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_NAME) { $id.PublisherDisplayName = $env:MSIX_PUBLISHER_NAME }
          & .\tools\make_msix.ps1 -Exe x64\FastRevers.exe -ExeArm64 arm64\FastRevers.exe -OutDir msix @id

      - uses: actions/upload-artifact@v4
        with:
          name: FastRevers-msixbundle
          path: msix/FastRevers-*.msixbundle
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FastRevers-*.zip
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l FastRevers-*.zip
          sha256sum FastRevers-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "FastRevers ${TAG#v}"
            echo
            echo "Official builds are published only at https://github.com/U-Said/FastRevers/releases."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "FastRevers ${TAG#v}" --notes-file notes.md --latest
          gh release upload "$TAG" FastRevers-*.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
